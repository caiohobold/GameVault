services:
  postgres:
    # Mesma versao do PostgreSQL, com a extensao pgvector (embeddings dos jogos)
    image: pgvector/pgvector:pg16
    container_name: gamevault-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamevault}
      POSTGRES_USER: ${POSTGRES_USER:-gamevault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamevault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gamevault-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamevault} -d ${POSTGRES_DB:-gamevault}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml:
    build: ./GameVaultML
    container_name: gamevault-ml
    restart: unless-stopped
    environment:
      ML_DB_HOST: postgres
      ML_DB_PORT: 5432
      ML_DB_NAME: ${POSTGRES_DB:-gamevault}
      ML_DB_USER: ${POSTGRES_USER:-gamevault}
      ML_DB_PASSWORD: ${POSTGRES_PASSWORD:-gamevault}
    ports:
      - "127.0.0.1:${ML_PORT:-8000}:8000"
    volumes:
      - gamevault-ml-modelos:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gamevault-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@gamevault.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gamevault-pgdata:
  gamevault-ml-modelos:
